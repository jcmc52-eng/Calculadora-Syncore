<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="layout">
    <section class="card calc">
      <div class="topbar">
        <h2 style="margin:0;font-size:1.15rem">Calculadora</h2>
      </div>
      <div class="display">
        <div class="expr" id="expr"></div>
        <div class="value" id="value">0</div>
      </div>
      <div class="keys">
        <button class="key fn" data-action="clear">C</button>
        <button class="key op" data-val="(">(</button>
        <button class="key op" data-val=")">)</button>
        <button class="key op" data-val="÷">÷</button>

        <button class="key" data-val="7">7</button>
        <button class="key" data-val="8">8</button>
        <button class="key" data-val="9">9</button>
        <button class="key op" data-val="×">×</button>

        <button class="key" data-val="4">4</button>
        <button class="key" data-val="5">5</button>
        <button class="key" data-val="6">6</button>
        <button class="key op" data-val="-">−</button>

        <button class="key" data-val="1">1</button>
        <button class="key" data-val="2">2</button>
        <button class="key" data-val="3">3</button>
        <button class="key op" data-val="+">+</button>

        <button class="key fn" data-action="back">⌫</button>
        <button class="key" data-val="0">0</button>
        <button class="key" data-val=".">.</button>
        <button class="key eq" data-action="equals">=</button>
      </div>
    </section>

    <section class="card history">
      <div class="topbar">
        <h2>Historial</h2>
      </div>
      <ul id="historyList"></ul>
      <div class="actions">
        <button class="btn btn-ghost" id="clearBtn">Limpiar</button>
        <button class="btn btn-primary" id="saveBtn">Save</button>
      </div>
    </section>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
